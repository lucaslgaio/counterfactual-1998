[project]
name = "counterfactual-1998"
version = "0.1.0"
description = "Simulador histórico contrafactual: como o mundo (1998-2026) teria evoluído se uma IA equivalente ao Claude 4 tivesse surgido no final da bolha .com"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=0.8.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "networkx>=3.0",
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
